name: Export Kurdish TTS to ONNX

on:
  workflow_dispatch:
    inputs:
      dialect:
        description: "Kurdish dialect to convert"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sorani
          - badini
      quantize:
        description: "Generate INT8 quantized models (~85MB) for mobile"
        required: true
        default: true
        type: boolean
      release_tag:
        description: "Release tag name (e.g. v1.0.0) - leave empty to skip Release creation"
        required: false
        default: ""
        type: string
  push:
    tags:
      - 'v*'
    paths:
      - 'export_onnx.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'export_onnx.py'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  export-onnx:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kurdish VITS to ONNX conversion
        run: |
          DIALECT="${{ github.event.inputs.dialect || 'all' }}"
          QUANTIZE_FLAG=""
          if [ "${{ github.event.inputs.quantize }}" = "false" ]; then
            QUANTIZE_FLAG="--no-quantize"
          fi

          echo "Exporting dialect: $DIALECT with quantize: $QUANTIZE_FLAG"
          python export_onnx.py \
            --dialect "$DIALECT" \
            --output-dir ./exported_models \
            $QUANTIZE_FLAG

      - name: Display exported file structure & sizes
        run: |
          echo "### Exported ONNX Models Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Dialect | File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          find ./exported_models -type f -exec ls -lh {} + | awk '{print "| " $9 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          ls -lhR ./exported_models

      - name: Upload Sorani ONNX artifact
        if: always() && (github.event.inputs.dialect == 'all' || github.event.inputs.dialect == 'sorani' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-tts-onnx-sorani
          path: exported_models/sorani/
          retention-days: 30

      - name: Upload Badini ONNX artifact
        if: always() && (github.event.inputs.dialect == 'all' || github.event.inputs.dialect == 'badini' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-tts-onnx-badini
          path: exported_models/badini/
          retention-days: 30

      - name: Upload All ONNX models
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-tts-onnx-all
          path: exported_models/
          retention-days: 30

      - name: Package models for GitHub Release
        id: package_release
        run: |
          mkdir -p release_assets
          if [ -d "exported_models/sorani" ]; then
            (cd exported_models/sorani && zip -r ../../release_assets/kurdish-tts-sorani-onnx.zip .)
          fi
          if [ -d "exported_models/badini" ]; then
            (cd exported_models/badini && zip -r ../../release_assets/kurdish-tts-badini-onnx.zip .)
          fi
          if [ -d "exported_models" ]; then
            (cd exported_models && zip -r ../release_assets/kurdish-tts-all-onnx.zip .)
          fi
          ls -lh release_assets/

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          body: |
            ## 🎙️ Kurdish Offline TTS ONNX Models

            Pre-converted and quantized ONNX models for offline Text-to-Speech in Flutter, Mobile, and Desktop applications.

            ### Included Dialects:
            - **Sorani (سۆرانی)**: based on `akam-ot/ckb-tts`
            - **Badini (بادینی)**: based on `akam-ot/mms-tts-kmr-arabic-finetune-base`

            ### Files inside each archive:
            - `model.onnx`: Full FP32 precision model (~330 MB)
            - `model.int8.onnx`: INT8 Quantized model (~85 MB) - recommended for mobile/Flutter
            - `tokens.txt`: Vocabulary mapping for ONNX Runtime / Sherpa-ONNX
            - `model_config.json`: Dialect and sampling rate config (16000 Hz)
            - `sample_test.wav`: Audio generated during verification
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
